<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <script>
        // CAMBIA ESTE ENLACE por el destino final que quieras hoy
        const enlaceDestino = "https://www.instagram.com/_javiercruzrodriguez/";

        function redireccionar() {
            window.location.href = enlaceDestino;
        }
        window.onload = redireccionar;
    </script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #3498db; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Redireccionando...</h2>
    <div class="loader"></div>
</body>
</html>
